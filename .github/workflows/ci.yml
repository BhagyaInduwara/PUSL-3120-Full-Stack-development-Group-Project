name: CI

# Runs the backend (Jest + Supertest) and frontend (Jest + React Testing
# Library) suites on every push/PR — neither needs any repository secrets:
# the backend suite starts its own ephemeral in-memory MongoDB and sets its
# own dummy JWT_SECRET (see server/src/__tests__/setupEnv.ts), and the
# frontend suite is pure component tests with no network calls. The
# Playwright E2E suite is a deliberate follow-up — it drives the real
# running app against a real MongoDB connection, so it needs a TEST Atlas
# cluster's MONGODB_URI/JWT_SECRET configured as GitHub Actions secrets
# first. See the TODO block at the bottom of the `test` job.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    name: Install & run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # Two separate npm projects in this repo (frontend at the root,
          # backend in /server) — each has its own lockfile to cache against.
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Run backend tests (Jest + Supertest)
        run: npm test --prefix server

      - name: Run frontend unit tests (Jest + React Testing Library)
        run: npm run test:unit

      # --- TODO (next phase) -------------------------------------------
